services:
  conciliacao-api:
    image: conciliacao-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=conciliacao-db;Database=ConciliacaoDb;User Id=sa;Password=YourStrong(!)Password;TrustServerCertificate=True;
    depends_on:
      conciliacao-db:
        condition: service_healthy

  conciliacao-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong(!)Password
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong(!)Password' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
    volumes:
      - sqlvolume:/var/opt/mssql

volumes:
  sqlvolume:
